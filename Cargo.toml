[package]
name = "repro"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Reproducibility checker: runs an experiment command N times and proves its outputs are byte-identical"
publish = false

[[bin]]
name = "repro"
path = "src/main.rs"

[features]
default = []
# Row/column-level Parquet diffs. Off by default to keep the binary small.
parquet = ["dep:parquet"]

[dependencies]
anyhow = "1"
blake3 = { version = "1.5", features = ["rayon"] }
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
similar = "2"
toml = "0.8"
walkdir = "2"
parquet = { version = "60", optional = true, default-features = false, features = ["snap", "flate2-rust_backend", "lz4", "zstd"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
