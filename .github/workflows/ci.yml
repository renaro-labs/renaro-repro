name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt, clippy and the full test suite (unit + fixture integration tests) on both platforms.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy -D warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked

  # The optional Parquet feature (row/column diffs).
  parquet-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo clippy --locked --all-targets --features parquet -- -D warnings
      - run: cargo test --locked --features parquet

  # Release binaries. Independent of `test`, so a binary is always produced to download.
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: repro.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: repro
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: cargo build --release
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Collect binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" dist/
          if [ "${{ runner.os }}" = "Windows" ]; then cp scripts/add-to-path.ps1 scripts/add-to-path.bat dist/; fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: repro-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
      - name: Binary must be under 5 MB
        run: |
          size=$(wc -c < "dist/${{ matrix.exe }}")
          echo "binary size: $size bytes ($((size / 1024)) KiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt $((5 * 1024 * 1024)) ]; then
            echo "::error::binary is $size bytes, over the 5 MB limit"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Startup time (--help) and hash speed
        run: python -I .github/scripts/measure.py "dist/${{ matrix.exe }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: End-to-end check on the good fixture with the release binary
        run: |
          BIN="$PWD/dist/${{ matrix.exe }}"
          cp -r tests/fixtures/good "$RUNNER_TEMP/good"
          cd "$RUNNER_TEMP/good"
          "$BIN" check -- python exp.py --config "{config}" --out "{run_dir}" --seed "{seed}" --cache-dir "{cache_dir}"
          if grep -qi "http" repro-report/report.html; then
            echo "::error::report.html references http"
            exit 1
          fi
          echo "report.html contains no 'http'" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-report-${{ matrix.target }}
          path: ${{ runner.temp }}/good/repro-report
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # On a v* tag, attach both binaries to a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: repro-*
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/repro-x86_64-pc-windows-msvc/repro.exe dist/repro-x86_64-pc-windows-msvc.exe
          mv dist/repro-x86_64-unknown-linux-musl/repro dist/repro-x86_64-unknown-linux-musl
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes \
            dist/repro-x86_64-pc-windows-msvc.exe dist/repro-x86_64-unknown-linux-musl \
            dist/repro-x86_64-pc-windows-msvc/add-to-path.ps1 dist/repro-x86_64-pc-windows-msvc/add-to-path.bat
