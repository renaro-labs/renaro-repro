<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #ffffff; --fg: #1d2129; --muted: #626a75; --line: #dde1e6; --panel: #f6f7f9;
  --ok: #1a7f37; --ok-bg: #e6f4ea; --bad: #c62828; --bad-bg: #fdecea; --warn: #9a6700; --warn-bg: #fff8c5;
  --hit: #2e7d32; --miss: #c77700; --code: #f3f4f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --fg: #e3e6ea; --muted: #9aa3ad; --line: #2c323a; --panel: #1b1f25;
    --ok: #57c07a; --ok-bg: #16301f; --bad: #ff7b72; --bad-bg: #3a1a1a; --warn: #e3b341; --warn-bg: #33290f;
    --hit: #57c07a; --miss: #e3a23b; --code: #1f242b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.banner { border-radius: 8px; padding: 14px 16px; margin: 12px 0; font-weight: 600; font-size: 17px; }
.banner.IDENTICAL { background: var(--ok-bg); color: var(--ok); }
.banner.DIFFERENT { background: var(--bad-bg); color: var(--bad); }
.banner.ERROR { background: var(--warn-bg); color: var(--warn); }
.banner ul { margin: 8px 0 0; padding-left: 20px; font-weight: 400; font-size: 14px; color: var(--fg); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; background: var(--panel); }
code, pre { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 12.5px; }
pre { background: var(--code); padding: 10px; border-radius: 6px; overflow-x: auto; margin: 6px 0; }
.s-identical { color: var(--ok); }
.s-identical_after_normalization { color: var(--warn); }
.s-different, .s-only_in_a, .s-only_in_b { color: var(--bad); font-weight: 600; }
.add { color: var(--ok); } .del { color: var(--bad); } .hunk { color: var(--muted); }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin: 8px 0; }
summary { cursor: pointer; font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 6px 0 8px; }
.controls input[type=search] { flex: 1 1 220px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
.hint { margin: 6px 0; }
.hint .fix { color: var(--muted); }
svg text { fill: var(--fg); font-size: 12px; }
.bar-hit { fill: var(--hit); } .bar-miss { fill: var(--miss); }
.legend span { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 12px; border-radius: 2px; }
</style>
</head>
<body>
<main>
<!--BODY-->
</main>
<script>
(function () {
  var q = document.getElementById('file-filter');
  var only = document.getElementById('file-only-bad');
  var rows = document.querySelectorAll('#file-table tbody tr');
  function apply() {
    var t = q ? q.value.toLowerCase() : '';
    var bad = only ? only.checked : false;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var show = r.getAttribute('data-path').toLowerCase().indexOf(t) >= 0 && (!bad || r.getAttribute('data-bad') === '1');
      r.style.display = show ? '' : 'none';
    }
  }
  if (q) { q.addEventListener('input', apply); }
  if (only) { only.addEventListener('change', apply); }
})();
</script>
</body>
</html>
